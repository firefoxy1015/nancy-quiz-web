<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Questions</title>
<meta name="description" content="Glance cards for paramedic history-taking and handover.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B131E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Call Qs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url('./fonts/atkinson-hyperlegible-400.woff2') format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/atkinson-hyperlegible-700.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url('./fonts/barlow-condensed-600.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/barlow-condensed-700.woff2') format('woff2')}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: a glance card. Home = every call as a short tile, one tap away. Card = the few must-ask cues large on the
   first screen with the don't-miss line, then the rest under short headings. Asked cues fade; YES answers turn yellow. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --fg:#0F1B2D; --muted:#55627A; --line:#C9D2DF;
  --accent:#0B5CAD; --accent-soft:#E3EEFA; --flag:#B3261E; --flag-bg:#FCE4E1; --flag-line:#E9A9A3; --ok:#1E7A4C;
  --yes-bg:#FFC933; --yes-fg:#231700; --yes-line:#A86C00;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B131E; --surface:#16233A; --fg:#EEF3FA; --muted:#9AA8BD; --line:#2E4060;
  --accent:#74B4FF; --accent-soft:#17304D; --flag:#FF9A90; --flag-bg:#4A1D1A; --flag-line:#8A3B35; --ok:#6FD3A0;
  --yes-bg:#F6B93B; --yes-fg:#1B1200; --yes-line:#FFE2A0; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B131E; --surface:#16233A; --fg:#EEF3FA; --muted:#9AA8BD; --line:#2E4060;
  --accent:#74B4FF; --accent-soft:#17304D; --flag:#FF9A90; --flag-bg:#4A1D1A; --flag-line:#8A3B35; --ok:#6FD3A0;
  --yes-bg:#F6B93B; --yes-fg:#1B1200; --yes-line:#FFE2A0; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.35;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 6px}
h1{font-size:28px;line-height:1}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px}
.search input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.search input:focus{border-color:var(--accent);outline:none}
.grp{font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 5px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:620px){.grid3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.tile{min-height:50px;padding:6px 8px;text-align:left;font-weight:700;font-size:16px;line-height:1.15;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.tile:active,.cue:active{background:var(--accent-soft)}
.none{color:var(--muted);padding:20px 0}
.addnote{margin:4px 0;padding:10px 12px;background:var(--accent-soft);border-radius:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 4px;text-decoration:underline}
.foot{color:var(--muted);font-size:13px;margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
.newpt{flex:none;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:14px}

/* card: a list of questions to ask the patient, in the words she says. First screen = the "ask first" questions
   (what she asks when she first walks up, in order) + the don't-miss strip. Then the rest under short headings;
   a blue "Before <drug>" block at the very end holds the checks before giving it (history first, medication last).
   A question has three states: 0 not asked, 1 asked, 2 the answer was YES. Hold one for the Chinese meaning.
   "Short view" turns every question back into a small cue tile so the whole card fits a screen or two. */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:8px;border-bottom:1px solid var(--line)}
.back{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:26px;line-height:1;font-weight:700}
.bar h2{flex:1;min-width:0;font-size:25px;line-height:1.02;text-wrap:balance}
.left{flex:none;font-size:14px;font-weight:700;color:var(--flag);font-variant-numeric:tabular-nums;white-space:nowrap}
.left.ok{color:var(--ok)}
.adds{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.adds::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 12px;border:1px dashed var(--muted);border-radius:999px;background:none;font-size:15px;white-space:nowrap;color:var(--muted)}
.chip.on{border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:700}
.legend{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--fg)}
.legend .link{flex:none;font-size:13.5px;padding:8px 2px;white-space:nowrap}
.blk h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:16px;letter-spacing:.08em;color:var(--muted);margin:14px 0 5px}
.blk h3 small{font-family:var(--body);font-size:12.5px;font-weight:400;letter-spacing:0;text-transform:none;white-space:nowrap}
.blk.first h3{color:var(--flag);margin-top:8px}
.cues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:620px){.cues{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cue{position:relative;min-height:44px;padding:6px 9px;text-align:left;font-weight:700;font-size:15.5px;line-height:1.15;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.blk.first .cue{min-height:56px;padding:8px 10px;font-size:18px;background:var(--flag-bg);border-color:var(--flag-line)}
.blk.small .cues{grid-template-columns:repeat(3,minmax(0,1fr))}
.blk.c4 .cues{grid-template-columns:repeat(4,minmax(0,1fr))}
.blk.small .cue{min-height:42px;font-size:14px;padding:5px 7px}
.blk.rx h3{color:var(--accent)}
.blk.rx .cue{background:var(--accent-soft);border-color:var(--accent)}
.blk .cue[data-st="1"]{background:none;border-style:dashed;border-color:var(--line);color:var(--muted);font-weight:400;opacity:.6}
.blk .cue[data-st="1"]::before{content:"✓ ";color:var(--ok);font-weight:700}
.blk .cue[data-st="2"]{background:var(--yes-bg);border-color:var(--yes-line);color:var(--yes-fg)}
.blk .cue[data-st="2"]::after{content:"YES";position:absolute;top:-7px;right:7px;padding:1px 5px;border-radius:5px;background:var(--yes-fg);color:var(--yes-bg);font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;line-height:1.25}
.cue.holding{outline:3px solid var(--accent);outline-offset:1px}
/* Under a point, in small type: what to ask next if the answer is yes. Hidden once the point is ticked as asked;
   in the compact pain / every-patient blocks it only shows on a YES. */
.fp{display:block;margin-top:3px;font-size:12.5px;font-weight:400;line-height:1.25;color:var(--muted)}
.blk.first .fp{font-size:13.5px}
.blk .cue[data-st="1"] .fp,.blk.small .fp{display:none}
.blk .cue[data-st="2"] .fp{display:block;color:inherit;font-weight:600}
/* Question view (the default): one question per row, in the words she says out loud. Under it, lighter, the
   follow-up questions for when the answer is yes; on a YES row they turn dark and the guideline note shows. */
.blk.ql .cues{grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.blk.ql .cues{grid-template-columns:repeat(2,minmax(0,1fr))}}
.blk .cue.q{min-height:48px;padding:9px 12px;font-size:17px;font-weight:600;line-height:1.28;text-wrap:pretty}
.blk.first .cue.q{padding:11px 12px;font-size:19px;font-weight:700;line-height:1.22}
.blk.small .cue.q{min-height:44px;padding:8px 12px;font-size:16px;font-weight:500}
.qf,.qc{display:block;margin-top:4px;font-size:14.5px;font-weight:400;line-height:1.3}
.qf{color:var(--muted)}
.qf::before{content:"↳ "}
.qc{display:none;font-weight:700}
.qc::before{content:"→ "}
.blk .cue.q[data-st="1"]{font-weight:400}
.blk .cue.q[data-st="1"] .qf{display:none}
.blk .cue.q[data-st="2"] .qf{color:inherit;font-size:16px;font-weight:600}
.blk .cue.q[data-st="2"] .qc{display:block}
.dm{margin-top:8px;padding:7px 11px 8px;background:var(--surface);border:1px solid var(--flag-line);border-left:5px solid var(--flag);border-radius:10px}
.dm h3{font-size:14px;letter-spacing:.08em;color:var(--flag);margin-bottom:1px}
.dm p{margin:2px 0;font-size:15px;line-height:1.3}
.miss{display:block;width:100%;margin-top:14px;min-height:46px;border:1px dashed var(--muted);border-radius:10px;background:none;color:var(--muted);font-weight:700;font-size:15px}
.full{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface)}
.full summary{padding:13px 0;font-weight:700;color:var(--accent)}
.full h4{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px}
.full ul{margin:0;padding-left:20px}
.full li{margin:5px 0}
.src{color:var(--muted);font-size:13px;margin:12px 0}

/* bottom dock on a card: YES answers, times, handover */
body.docked{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:7px max(12px,env(safe-area-inset-right,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dock .in,.sheet .in{max-width:760px;margin:0 auto}
.dock .in{display:flex;gap:6px}
.dock button{flex:none;min-height:48px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;font-size:15px}
.dock .yes{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;color:var(--muted)}
.dock .yes.on{background:var(--yes-bg);border-color:var(--yes-line);color:var(--yes-fg)}
.dock .yes b{font-family:var(--display);font-size:17px;letter-spacing:.05em;margin-right:4px}
.dock .ho{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* bottom sheet: words to say, what a yes changes, YES list, times, notes */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:72vh;overflow:auto;background:var(--surface);border-top:2px solid var(--fg);border-radius:16px 16px 0 0;box-shadow:0 -10px 28px rgba(0,0,0,.28);
  padding:10px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .k{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet .x{flex:none;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:22px;line-height:1;font-weight:700}
.sheet .say{margin:6px 0 4px;font-size:22px;line-height:1.28;font-weight:700;text-wrap:pretty}
.sheet .zh{margin:0 0 8px;font-size:16px;color:var(--muted)}
.sheet .fu{margin:0 0 8px;font-size:17px;line-height:1.3}
.sheet .fu b{display:block;font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet .chg{margin:8px 0;padding:8px 11px;border-radius:10px;background:var(--yes-bg);color:var(--yes-fg);font-size:17px;line-height:1.3}
.sheet .chg b{display:block;font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.sheet .chg small{font-size:13px;white-space:nowrap}
.sheet .srcl,.hint{margin:6px 0 10px;font-size:13.5px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acts button{min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700}
.acts button[aria-current="true"]{border:2px solid var(--fg)}
.acts2{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.btn{min-height:46px;padding:0 16px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--bg);font-weight:700}
.btn.ghost{background:none;color:var(--accent)}
.frow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.frow .w{flex:1;min-width:0}
.frow .t{font-weight:700}
.frow .n{font-size:15px;color:var(--muted);line-height:1.3}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.presets button{min-height:46px;padding:0 14px;border:1px solid var(--accent);border-radius:999px;background:var(--accent-soft);font-weight:700}
.stamp{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.stamp input{min-width:0;height:42px;padding:0 8px;font:inherit;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.stamp input[type="time"]{flex:none;width:122px;font-weight:700;font-variant-numeric:tabular-nums}
.stamp input[type="text"]{flex:1}
.note textarea{display:block;width:100%;min-height:110px;padding:10px;font:inherit;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.note textarea:focus{border-color:var(--accent);outline:none}

/* handover section */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tile.ho{background:var(--accent);color:var(--bg);border-color:var(--accent);font-size:18px;min-height:58px}
.tile.ho small{display:block;font-weight:400;font-size:13px;line-height:1.2;margin-top:3px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-block:8px 0}
.seg button{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700}
.seg button[aria-current="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.use{margin:8px 0 4px;font-size:15px;color:var(--muted)}
.tel{font-weight:700;color:var(--fg);white-space:nowrap;user-select:all;-webkit-user-select:all}
.step{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--fg);color:var(--bg);font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.rows{display:grid;gap:6px}
.row{display:flex;gap:12px;align-items:center;width:100%;min-height:58px;padding:6px 10px 6px 6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
.row:active{background:var(--accent-soft)}
.row .L{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:8px;background:var(--accent);color:var(--bg);font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.row .W{min-width:0}
.row .T{display:block;font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.row .d{display:block;font-size:16px;line-height:1.25}
.row[aria-pressed="true"]{background:none;border-style:dashed;opacity:.55}
.row[aria-pressed="true"] .L{background:var(--ok)}
.row .y{display:block;margin-top:4px;padding:2px 7px;border-radius:6px;background:var(--yes-bg);color:var(--yes-fg);font-size:15px;font-weight:700;line-height:1.3}
.use .y{padding:1px 6px;border-radius:5px;background:var(--yes-bg);color:var(--yes-fg);font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<p class="wrap foot" id="offl"></p>
<script>
// first = ask in the first minute. s = [section title, [questions]]. miss = don't-miss list.
var G=["Heart & breathing","Brain & nerves","Medical","Trauma","Environment","Special calls"];
var SAMPLE=["Any allergies — medications, food, latex?","What medications do you take? Did you take them today?","Any blood thinners?","What medical problems do you have? Any surgeries?","Have you been in hospital in the last 90 days, or seen a doctor recently?","When did you last eat or drink?","What were you doing right before this started?","Is there a MOST form, No CPR form or advance directive we should know about?"];
var C=[
{id:"chest-pain",n:"Chest pain",g:0,k:"cardiac acs mi heart attack angina stemi",
first:["Is the pain there right now? Show me where with one finger.","Any trouble breathing?","Did you pass out, or feel like you were going to?","Have you taken Aspirin or nitro today? How much, and when? Is the nitro prescribed to you?","Any allergy to Aspirin? Any recent bleeding from your stomach or bowel?","Any Viagra, Cialis or Levitra in the last 2 days?"],
s:[["The pain (OPQRRRST)",["What time did it start? What were you doing?","Did it hit suddenly and at its worst right away, or build up slowly?","Does anything make it better or worse — a deep breath, moving, pressing on it?","What does it feel like — pressure, tight, sharp, burning, tearing?","Does it go anywhere — arm, jaw, neck, back, belly?","Did the nitro or resting help?","How bad out of 10 right now? At its worst?","Is it constant, or does it come and go?","Have you had this before? Is it the same as your angina or heart attack?"]],
["With the pain",["Nausea or vomiting?","Sweaty or clammy?","Dizzy or light-headed?","Heart racing or skipping beats?","Cough, fever, or coughing anything up?","Is one leg swollen or sore? Any long trip, surgery or bed rest lately?","Any cancer, pregnancy, birth control or hormone pills, or past blood clots?","Any new weakness, numbness, hoarse voice, or a cold or painful arm or leg?"]],
["Heart history",["Any heart problems — heart attack, stents, bypass, heart failure?","High blood pressure, diabetes, high cholesterol? Do you smoke?","Anyone in your family with heart disease at a young age?","Any aortic aneurysm or dissection in you or your family? Marfan syndrome? Any heart or aortic surgery?","Any cocaine or other stimulants today?"]]],
miss:["Heart attack — can show up as just shortness of breath, belly pain, fainting, nausea or tiredness, especially in women, older adults, diabetics and younger people","Blood clot in the lung (PE)","Aortic dissection — sharp or tearing pain, worst at the start; can be painless with only fainting or stroke signs; equal arm BPs do not rule it out","Collapsed lung","Pain when you press on the chest does not rule out the heart"]},

{id:"breathing",n:"Breathing problems",g:0,k:"sob short of breath dyspnea asthma copd chf wheeze respiratory",
first:["Can you speak in full sentences? (listen — full sentences, a few words, or single words)","When did this start? Suddenly or over hours or days?","Any chest pain? Did you faint or nearly faint?","Did you use your puffer? Which one, how many puffs, did it help?","Could this be an allergic reaction — any new food, medication, or a sting?"],
s:[["The breathing",["What were you doing when it started?","Is it worse lying flat? How many pillows do you sleep on?","Do you wake up at night gasping?","Is it worse when you walk or move?","Has this happened before? What was it that time?","Is this like your usual asthma / COPD attack, or different?"]],

function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function attr(t){return esc(t).replace(/"/g,"&quot;")}
function find(id){for(var i=0;i<C.length;i++)if(C[i].id===id)return C[i];return null}
function groupOf(id){for(var i=0;i<GROUPS.length;i++)if(GROUPS[i].parts.indexOf(id)>=0)return GROUPS[i];return null}
function ticks(){return Object.keys(done).length+stamps.length}
function hash(){return location.hash.replace("#","")}
function now(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
// Detail for one cue as asked on one call. src null = no detail on file, "" = general practice.
function det(call,k){
  var d=(typeof D!=="undefined"&&D[call]&&D[call][k])||DS[k];
  return d?{say:d[0],zh:d[1],src:d[2],chg:d[3],csrc:d[4],ho:d[5]||"M",fu:d[6]||"",fp:d[7]||""}:{say:"",zh:"",src:null,chg:"",csrc:"",ho:"M",fu:"",fp:""};
}
// A source is a guideline code ("C01") or a drug monograph ("DM:nitroglycerin").
function gname(code){var n=typeof CPGN!=="undefined"&&CPGN[code]; return code.indexOf("DM:")===0?"drug monograph "+(n||code.slice(3)):"guideline "+code+(n?" "+n:"")}
function pops(d){return !!d.chg&&!/^if /i.test(d.chg)}   // a note that starts "If ..." has its own condition, so it does not pop up on a plain YES
function gshort(code){return code.indexOf("DM:")===0?"drug monograph":code}

function tile(id){return '<button class="tile" data-go="'+id+'">'+esc(SN[id])+'</button>'}
function list(q){
  var h="";
  if(q){
    var m=C.filter(function(c){return (SN[c.id]+" "+c.n+" "+c.k).toLowerCase().indexOf(q)>=0});
    var ho=!adding&&HOWORDS.indexOf(q)>=0?hoTiles():"";
    return m.length||ho?ho+(m.length?'<div class="grid3">'+m.map(function(c){return tile(c.id)}).join("")+'</div>':''):'<p class="none">Nothing matches. Try another word, or open Sick / weak.</p>';
  }
  if(!adding)h+=hoTiles();
  if(recent.length&&!adding)h+='<div class="grp">Recent</div><div class="grid3">'+recent.map(tile).join("")+'</div>';
  GROUPS.forEach(function(g){h+='<div class="grp">'+esc(g.n)+'</div><div class="grid3">'+g.parts.map(tile).join("")+'</div>'});
  return h;
}
function notesHtml(){

  return h+'<p class="acts2" style="margin-bottom:12px"><button class="btn" id="copynotes">Copy all</button><button class="btn ghost" id="delnotes">Delete all</button></p></details>';

function home(){
  curIds=[];
  var h='<div class="top"><h1>Call Questions</h1>'+(ticks()&&!adding?'<button class="newpt" id="newpt">New patient</button>':'')+'</div>';
  if(adding)h+='<p class="addnote">Adding to <b>'+esc(SN[adding])+'</b> — pick another complaint. <button class="link" id="canceladd">Cancel</button></p>';
  h+='<div class="search"><input id="search" type="search" placeholder="Search — sob, od, mvc, stroke…" autocomplete="off" value="'+attr(query)+'"></div><div id="list">'+list(query.trim().toLowerCase())+'</div>';
  if(!adding)h+=notesHtml();
  h+='<p class="foot">On a card: every tile is a point to ask; the small words under it are what to ask next. Tap it when you have asked it, tap again if the answer is yes, hold it for the words to say. A memory aid for history-taking, checked against the BCEHS Clinical Practice Guidelines as published 26 Nov 2026. It does not replace the guidelines or your own assessment.</p>';

// o = {t: cue text, c: call it belongs to}. Question view shows the question in the words to say, with its follow-up
// questions and (on a YES) the guideline note; short view shows only the cue, as a small tile.
function cueBtn(o){var k=o.t.toLowerCase(), st=done[k]||0, d=det(o.c,k), q=view==="q"&&!!d.say&&!o.chk;
  return '<button class="cue'+(q?" q":"")+'" data-cue="'+attr(k)+'" data-call="'+o.c+'" data-label="'+attr(o.t)+'" data-st="'+st+'" aria-pressed="'+(st?"true":"false")+'">'+
    (q?'<span class="qs">'+esc(d.say)+'</span>'+(d.fu?'<span class="qf">'+esc(d.fu)+'</span>':'')+(pops(d)?'<span class="qc">'+esc(d.chg)+'</span>':''):
       esc(o.t)+(d.fp&&!o.chk?'<span class="fp">'+esc(d.fp)+'</span>':''))+'</button>'}
function block(title,cues,cls){return cues.length?'<section class="blk '+cls+(view==="q"&&!/chk/.test(cls)?" ql":"")+'"><h3>'+esc(title)+'<small></small></h3><div class="cues">'+cues.map(cueBtn).join("")+'</div></section>':""}
function fullHtml(c){
  var h='<details class="full"><summary>Full wording — '+esc(SN[c.id])+'</summary>';
  [["Ask first",c.first]].concat(c.s).forEach(function(s){h+='<h4>'+esc(s[0])+'</h4><ul>'+s[1].map(function(t){return"<li>"+esc(t)+"</li>"}).join("")+'</ul>'});
  h+='<h4>Keep in mind</h4><ul>'+c.miss.map(function(t){return"<li>"+esc(t)+"</li>"}).join("")+'</ul>';
  h+='<p class="src">'+(CPG[c.id]?'Checked against BCEHS guidelines '+esc(CPG[c.id].split(" ").join(" · "))+'.':'No BCEHS guideline covers this on its own. These questions are general practice.')+'</p>';
  return h+'</details>';
}
function card(c){
  if(firstCard){firstCard=false; if(saved.primary===c.id&&saved.extra&&!extra.length)extra=saved.extra.filter(function(i){return !!SN[i]&&i!==c.id})}
  primary=c.id;
  var ids=[c.id].concat(extra.filter(function(i){return i!==c.id})), seen={};
  curIds=ids;
  function tag(i,a){return (a||[]).map(function(t){return {t:t,c:i}})}
  function uniq(a){return a.filter(function(o){var k=o.t.toLowerCase();if(seen[k])return false;seen[k]=1;return true})}
  if(ids.indexOf("chest-pain")>=0)seen[Q.cps.toLowerCase()]=1;
  var first=[], gn=[], gm={};
  ids.forEach(function(i){
    (K[i].skip||[]).forEach(function(t){seen[t.toLowerCase()]=1});   // pain-block cues this card asks in its own words
    first=first.concat(tag(i,K[i].key));
    (K[i].g||[["Then ask",K[i].more||[]]]).forEach(function(g){if(!gm[g[0]]){gm[g[0]]=[];gn.push(g[0])} gm[g[0]]=gm[g[0]].concat(tag(i,g[1]))});
  });
  // Things she checks or looks at herself ("Check: ...") are steps, not questions to the patient: they come out of
  // the question list into one small "Check" row of tiles under the don't-miss strip.
  var checks=[];
  function pull(a){return a.filter(function(o){if(/^check:/i.test(det(o.c,o.t.toLowerCase()).say)){o.chk=1;checks.push(o);return false}return true})}
  first=pull(uniq(first));
  var hasOpq=ids.some(function(i){return K[i].opq});
  if(hasOpq)seen["events before"]=1;   // the pain block already asks "what were you doing?" with the onset time
  var opq=hasOpq?uniq(tag("_",OPQ)):[];
  var h='<div class="bar"><button class="back" data-go="" aria-label="All calls">‹</button><h2>'+ids.map(function(i){return esc(SN[i])}).join(" + ")+'</h2><span class="left" id="left"></span><button class="newpt" id="newpt">New pt</button></div>';
  h+='<div class="adds">';
  extra.forEach(function(i){h+='<button class="chip on" data-rm="'+i+'">'+esc(SN[i])+' ×</button>'});
  (groupOf(c.id)||{parts:[]}).parts.forEach(function(i){if(ids.indexOf(i)<0)h+='<button class="chip" data-add="'+i+'">+ '+esc(SN[i])+'</button>'});
  h+='<button class="chip" id="addother">+ Other…</button></div>';
  h+=block("Ask first",first,"first");
  h+='<div class="dm"><h3>Don\'t miss</h3>'+ids.map(function(i){return'<p>'+(ids.length>1?'<b>'+esc(SN[i])+':</b> ':'')+esc(K[i].dm)+'</p>'}).join("")+'</div>';
  h+='<p class="legend"><span>Tap = asked · again = <b>YES</b> · hold = '+(view==="q"?'中文':'words')+'</span><button class="link" id="viewbtn">'+(view==="q"?'Points only':'Full sentences')+'</button></p>';
  var rest="";
  rest+=block("The pain",opq,"small c4");
  // History first, medication last: the blue "Before <drug>" checks come after everything else on the card,
  // because she finishes the history and moves to the ambulance before thinking about medication.
  var isRx=function(n){return /^Before /.test(n)};
  gn.forEach(function(n){if(!isRx(n))rest+=block(GLABEL[n]||n,pull(uniq(gm[n])),"")});
  rest+=block("Every patient",uniq(tag("_",SAMPLE_CUES)),"small");
  gn.forEach(function(n){if(isRx(n))rest+=block(n,pull(uniq(gm[n])),"rx")});
  h+=block("Check",checks,"small chk")+rest;
  h+='<button class="miss" id="missbtn">Something missing on this card?</button>';
  ids.forEach(function(i){h+=fullHtml(find(i))});
  app.innerHTML=h; left();
  recent=[c.id].concat(recent.filter(function(i){return i!==c.id})).slice(0,3);
  try{localStorage.setItem("cq-recent",JSON.stringify(recent))}catch(e){}
  save();
}
function left(){
  var el=document.getElementById("left"); if(!el)return;
  var n=app.querySelectorAll('.blk.first .cue[data-st="0"]').length;
  el.textContent=n?n+" to ask":"✓ asked"; el.className="left"+(n?"":" ok");
  var bl=app.querySelectorAll("section.blk");
  for(var i=0;i<bl.length;i++){var s=bl[i].querySelector("h3 small"); if(!s)continue;
    var m=bl[i].querySelectorAll('.cue[data-st="0"]').length; s.textContent=m?m+" left":"✓"}
}
function hoTiles(){
  return '<div class="grp">Handover</div><div class="grid2">'+Object.keys(HO).map(function(k){
    return '<button class="tile ho" data-go="'+k+'" data-keep>'+esc(HO[k].n)+'<small>'+esc(HO[k].tag)+'</small></button>'}).join("")+'</div>';
}
function yesFor(codes){var o=[]; Object.keys(yes).forEach(function(k){if(codes.indexOf(det(yes[k].c,k).ho)>=0)o.push(yes[k].l)}); return o}
function stampsFor(codes){return stamps.filter(function(s){return codes.indexOf(TSET[s.l]?"T":"Tx")>=0}).map(function(s){return s.t+(s.l?" "+s.l:"")})}
function handover(id){
  var o=HO[id], n=0, map=HOMAP[id]||[];
  var h='<div class="bar"><button class="back" data-go="'+from+'" data-keep aria-label="Back">‹</button><h2>'+esc(o.n)+'</h2><button class="newpt" id="timebtn">Times</button><button class="newpt" id="clearho">Clear</button></div>';
  h+='<div class="seg">'+Object.keys(HO).map(function(k){return '<button data-go="'+k+'" data-keep aria-current="'+(k===id)+'">'+esc(HO[k].n)+'</button>'}).join("")+'</div>';
  h+='<p class="use">'+o.use+'</p>';
  if(Object.keys(yes).length||stamps.length)h+='<p class="use"><span class="y">Yellow</span> = your YES answers and times from this patient.</p>';
  o.parts.forEach(function(p){
    if(p.step){h+='<div class="step">'+esc(p.step)+'</div>';return}
    h+='<section class="blk"><h3>'+esc(p.h)+'</h3><div class="rows">';
    p.rows.forEach(function(r){var codes=map[n], key="ho:"+id+":"+(n++), ex="";
      if(codes){var ts=stampsFor(codes), ys=yesFor(codes);
        if(ts.length)ex+='<span class="y">'+esc(ts.join(" · "))+'</span>';
        if(ys.length)ex+='<span class="y">Yes: '+esc(ys.join(" · "))+'</span>'}
      h+='<button class="row" data-row="'+key+'" aria-pressed="'+(done[key]?"true":"false")+'"><span class="L">'+r[0]+'</span><span class="W"><span class="T">'+esc(r[1])+'</span>'+r[2].map(function(d){return '<span class="d">'+esc(d)+'</span>'}).join("")+ex+'</span></button>'});
    h+='</div></section>';
  });
  o.more.forEach(function(m){h+='<details class="full"><summary>'+esc(m[0])+'</summary><ul>'+m[1].map(function(t){return"<li>"+esc(t)+"</li>"}).join("")+'</ul></details>'});
  h+='<p class="src">From BCEHS guideline A03 Clinical Handover and Communication, as published 26 Nov 2026.</p>';
  app.innerHTML=h;
}

// mode "say" = opened by holding a cue, "yes" = opened because the answer was just marked YES.
function cueSheet(k,call,label,mode){
  var d=det(call,k), st=done[k]||0;
  var chg=d.chg?'<p class="chg"><b>What it changes</b>'+esc(d.chg)+(d.csrc?' <small>(BCEHS '+esc(gname(d.csrc))+')</small>':'')+'</p>':'';
  var say='<p class="say">'+esc(d.say||label)+'</p>'+(d.zh?'<p class="zh">'+esc(d.zh)+'</p>':'')+(d.fu?'<p class="fu"><b>Then ask</b>'+esc(d.fu)+'</p>':'');
  var h=hd(esc(label))+(mode==="yes"?chg+say:say+chg);
  if(d.src!==null)h+='<p class="srcl">'+(d.src?'From BCEHS '+esc(gname(d.src)):'General practice — not in a BCEHS guideline')+'</p>';
  h+='<div class="acts"><button data-set="1"'+(st===1?' aria-current="true"':'')+'>Asked ✓</button><button data-set="2"'+(st===2?' aria-current="true"':'')+'>YES</button><button data-set="0"'+(st===0?' aria-current="true"':'')+'>Not asked</button></div>';
  openSheet(h); sheetCue={k:k,c:call,l:label};
}
function setCue(k,call,label,st){
  if(st)done[k]=st; else delete done[k];
  if(st===2)yes[k]={c:call,l:label}; else delete yes[k];
  var bs=app.querySelectorAll(".cue");
  for(var i=0;i<bs.length;i++)if(bs[i].getAttribute("data-cue")===k){bs[i].setAttribute("data-st",st);bs[i].setAttribute("aria-pressed",st?"true":"false")}
  left(); dock(); save();
}
function yesSheet(){
  var ks=Object.keys(yes), h=hd("YES answers");
  if(!ks.length)h+='<p class="hint">Nothing yet. Tap a question twice when the answer is yes; it turns yellow and is kept here for your handover.</p>';
  ks.forEach(function(k){var d=det(yes[k].c,k);
    h+='<div class="frow"><div class="w"><div class="t">'+esc(yes[k].l)+'</div>'+(d.chg?'<div class="n">'+esc(d.chg)+(d.csrc?' ('+esc(gshort(d.csrc))+')':'')+'</div>':'')+'</div><button class="x" data-unyes="'+attr(k)+'" aria-label="Remove">×</button></div>'});
  if(stamps.length)h+='<div class="frow"><div class="w"><div class="t">Times</div><div class="n">'+esc(stamps.map(function(s){return s.t+(s.l?" "+s.l:"")}).join(" · "))+'</div></div></div>';
  h+='<p class="acts2"><button class="btn" data-go="atmist-ambo" data-keep>Open handover</button></p>';
  openSheet(h);
}
function timeSheet(focus){
  var pre=[]; curIds.concat(["_"]).forEach(function(i){(TX[i]||[]).forEach(function(l){if(pre.indexOf(l)<0)pre.push(l)})});
  var h=hd("Times")+'<p class="hint">One tap stamps the time now. Tap the time to correct it.</p><div class="presets">'+pre.map(function(l){return '<button data-stamp="'+attr(l)+'">'+esc(l)+'</button>'}).join("")+'<button data-stamp="">Other…</button></div>';
  stamps.forEach(function(s,i){h+='<div class="stamp"><input type="time" data-si="'+i+'" value="'+attr(s.t)+'" aria-label="Time"><input type="text" data-sl="'+i+'" value="'+attr(s.l)+'" placeholder="What?" aria-label="What happened"><button class="x" data-rmstamp="'+i+'" aria-label="Remove">×</button></div>'});
  openSheet(h);
  if(focus>=0){var f=sheetEl.querySelector('[data-'+(stamps[focus].l?"si":"sl")+'="'+focus+'"]');
    if(f){ if(!stamps[focus].l)f.focus(); else if(TSET[stamps[focus].l]){try{f.showPicker()}catch(e){}} }}
}
function noteSheet(){
  openSheet(hd("Something missing?")+'<p class="hint">Write what you needed that was not here. It is saved on this phone; copy your notes from the home screen later.</p><div class="note"><textarea id="notetext" placeholder="e.g. Should ask about home oxygen"></textarea></div><p class="acts2"><button class="btn" id="savenote">Save note</button></p>');
  var ta=document.getElementById("notetext"); if(ta)ta.focus();
}
function copyNotes(btn){
  var txt=notes.map(function(n){return new Date(n.t).toLocaleString()+" ["+n.c+"] "+n.x}).join("\n");
  function ok(){btn.textContent="Copied ✓"}
  function fb(){var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{if(document.execCommand("copy"))ok(); else btn.textContent="Could not copy"}catch(e){btn.textContent="Could not copy"} document.body.removeChild(ta)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fb); else fb();
}
sheetEl.addEventListener("input",function(e){var t=e.target, i;
  if(t.hasAttribute("data-si")){i=+t.getAttribute("data-si"); if(stamps[i]){stamps[i].t=t.value; save(); dock()}}
  else if(t.hasAttribute("data-sl")){i=+t.getAttribute("data-sl"); if(stamps[i]){stamps[i].l=t.value; save(); dock()}}
});

function route(){
  var id=hash(), c=find(id);
  hideSheet();
  if(HO[id]&&!adding)handover(id); else if(c&&!adding)card(c); else home();
  dock();
  window.scrollTo(0,0);
}
function go(id){ if(hash()===id)route(); else location.hash=id }
var wl=null;
function wake(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request("screen").then(function(l){wl=l;l.addEventListener("release",function(){wl=null})}).catch(function(){})}catch(e){}}

// Hold a cue (about half a second) to see the words to say. Moving the finger (scrolling) cancels it.
var holdT=null, held=false, hx=0, hy=0, holdEl=null;
function cancelHold(){clearTimeout(holdT); holdT=null; if(holdEl){holdEl.classList.remove("holding"); holdEl=null}}
app.addEventListener("pointerdown",function(e){
  var t=e.target.closest(".cue"); cancelHold(); held=false; if(!t)return;
  hx=e.clientX; hy=e.clientY; holdEl=t;
  holdT=setTimeout(function(){
    holdT=null; held=true; t.classList.add("holding");
    try{if(navigator.vibrate)navigator.vibrate(12)}catch(err){}
    cueSheet(t.getAttribute("data-cue"),t.getAttribute("data-call"),t.getAttribute("data-label"),"say");
  },430);
});
app.addEventListener("pointermove",function(e){if(holdT&&(Math.abs(e.clientX-hx)>9||Math.abs(e.clientY-hy)>9))cancelHold()});
app.addEventListener("pointerup",function(){cancelHold(); if(held)setTimeout(function(){held=false},400)});   // some phones send no click after a hold
app.addEventListener("pointercancel",cancelHold);
app.addEventListener("contextmenu",function(e){if(e.target.closest(".cue"))e.preventDefault()});

document.addEventListener("click",function(e){
  wake();
  var t=e.target.closest("button"); if(!t)return;
  var cur=hash(), k, s, q;
  if(t.classList.contains("cue")){
    if(held){held=false;return}          // this click is the end of a hold, not a tap
    k=t.getAttribute("data-cue"); q=t.getAttribute("data-call"); s=((done[k]||0)+1)%3;
    setCue(k,q,t.getAttribute("data-label"),s);
    // In question view the guideline note shows inside the yellow row; in short view it opens as a sheet.
    if(s===2&&view!=="q"&&pops(det(q,k)))cueSheet(k,q,t.getAttribute("data-label"),"yes"); else hideSheet();
  }
  else if(t.id==="viewbtn"){view=view==="q"?"s":"q"; try{localStorage.setItem("cq-view",view)}catch(err){} route()}
  else if(t.hasAttribute("data-set")&&sheetCue){s=+t.getAttribute("data-set"); q=sheetCue; setCue(q.k,q.c,q.l,s);
    if(s===2&&view!=="q"&&pops(det(q.c,q.k)))cueSheet(q.k,q.c,q.l,"yes"); else hideSheet()}
  else if(t.id==="closesheet")closeSheet();
  else if(t.id==="yesbtn")yesSheet();
  else if(t.hasAttribute("data-unyes")){setCue(t.getAttribute("data-unyes"),"","",1); yesSheet()}
  else if(t.id==="timebtn")timeSheet(-1);
  else if(t.hasAttribute("data-stamp")){stamps.push({l:t.getAttribute("data-stamp"),t:now()}); save(); dock(); timeSheet(stamps.length-1)}
  else if(t.hasAttribute("data-rmstamp")){stamps.splice(+t.getAttribute("data-rmstamp"),1); save(); dock(); timeSheet(-1)}
  else if(t.id==="missbtn")noteSheet();
  else if(t.id==="savenote"){var x=(document.getElementById("notetext").value||"").trim();
    if(x){notes.unshift({t:Date.now(),c:curIds.length?curIds.map(function(i){return SN[i]}).join(" + "):"Home",x:x}); saveNotes()}
    hideSheet(); if(!find(cur)&&!HO[cur])route();
    if(x){openSheet(hd("Saved ✓")+'<p class="hint">Your notes are at the bottom of the home screen.</p>'); setTimeout(function(){if(!sheetCue&&sheetEl.textContent.indexOf("Saved")>=0)hideSheet()},1500)}}
  else if(t.id==="copynotes")copyNotes(t);
  else if(t.id==="delnotes"){ if(t.getAttribute("data-sure")){notes=[]; saveNotes(); route()} else {t.setAttribute("data-sure","1"); t.textContent="Tap again to delete all"} }
  else if(t.hasAttribute("data-row")){var rk=t.getAttribute("data-row"), ron=t.getAttribute("aria-pressed")!=="true"; t.setAttribute("aria-pressed",ron?"true":"false"); if(ron)done[rk]=1; else delete done[rk]; save()}
  else if(t.id==="clearho"){Object.keys(done).forEach(function(x){if(x.indexOf("ho:"+cur+":")===0)delete done[x]}); save(); route()}
  else if(t.hasAttribute("data-go")){var id=t.getAttribute("data-go");
    if(adding&&id){var p=adding; if(id!==p&&extra.indexOf(id)<0)extra.push(id); adding=""; query=""; go(p)}
    else{ if(HO[id]&&!HO[cur])from=cur; if(id&&!t.hasAttribute("data-keep"))extra=[]; adding=""; query=""; go(id) }}
  else if(t.hasAttribute("data-add")){extra.push(t.getAttribute("data-add")); route()}
  else if(t.hasAttribute("data-rm")){var r=t.getAttribute("data-rm"); extra=extra.filter(function(i){return i!==r}); route()}
  else if(t.id==="addother"){adding=cur; go("")}
  else if(t.id==="canceladd"){var b=adding; adding=""; go(b)}
  else if(t.id==="newpt"){done={}; yes={}; stamps=[]; extra=[]; primary=""; save(); route()}
});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")wake()});
window.addEventListener("hashchange",route);
route();
</script>
<script>
(function(){
  var el=document.getElementById('offl'), V='27 Nov 2026 16:31';
  function say(t){el.textContent=t+' · Version '+V}
  if(!('serviceWorker' in navigator)||!window.isSecureContext){say('Offline use is not available in this browser');return}
  var had=!!navigator.serviceWorker.controller;
  say(had?'Offline ready \u2713':'Saving for offline use\u2026');
  navigator.serviceWorker.register('./sw.js').then(function(){return navigator.serviceWorker.ready})
    .then(function(){say('Offline ready \u2713 works with no signal')})
    .catch(function(){say('Could not save for offline use')});
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!had){had=true;return}
    if(!location.hash.replace('#','')&&!Object.keys(done).length)location.reload();
    else say('Update saved, it loads next time you open the app');
  });
})();
</script>
