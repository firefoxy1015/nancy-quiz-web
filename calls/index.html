<meta name="theme-color" content="#0B131E" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url('./fonts/atkinson-hyperlegible-400.woff2') format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/atkinson-hyperlegible-700.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url('./fonts/barlow-condensed-600.woff2') format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/barlow-condensed-700.woff2') format('woff2')}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: a glance card. Home = every call as a short tile, one tap away. Card = cue words in a 2-column grid:
   red "ask first", then the rest. Tapped cues fade, so what is still bright is what has not been asked. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --fg:#0F1B2D; --muted:#55627A; --line:#C9D2DF;
  --accent:#0B5CAD; --accent-soft:#E3EEFA; --flag:#B3261E; --flag-bg:#FCE4E1; --flag-line:#E9A9A3; --ok:#1E7A4C;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B131E; --surface:#16233A; --fg:#EEF3FA; --muted:#9AA8BD; --line:#2E4060;
  --accent:#74B4FF; --accent-soft:#17304D; --flag:#FF9A90; --flag-bg:#4A1D1A; --flag-line:#8A3B35; --ok:#6FD3A0; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B131E; --surface:#16233A; --fg:#EEF3FA; --muted:#9AA8BD; --line:#2E4060;
  --accent:#74B4FF; --accent-soft:#17304D; --flag:#FF9A90; --flag-bg:#4A1D1A; --flag-line:#8A3B35; --ok:#6FD3A0; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.35;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0}

/* home */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 6px}
h1{font-size:28px;line-height:1}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px}
.search input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.search input:focus{border-color:var(--accent);outline:none}
.grp{font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 5px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:620px){.grid3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.tile{min-height:50px;padding:6px 8px;text-align:left;font-weight:700;font-size:16px;line-height:1.15;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.tile:active,.cue:active{background:var(--accent-soft)}
.none{color:var(--muted);padding:20px 0}
.addnote{margin:4px 0;padding:10px 12px;background:var(--accent-soft);border-radius:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 4px;text-decoration:underline}
.foot{color:var(--muted);font-size:13px;margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
.newpt{flex:none;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:14px}

/* card */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:8px;border-bottom:1px solid var(--line)}
.back{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:26px;line-height:1;font-weight:700}
.bar h2{flex:1;min-width:0;font-size:25px;line-height:1.02;text-wrap:balance}
.left{flex:none;font-size:14px;font-weight:700;color:var(--flag);font-variant-numeric:tabular-nums;white-space:nowrap}
.left.ok{color:var(--ok)}
.adds{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.adds::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 12px;border:1px dashed var(--muted);border-radius:999px;background:none;font-size:15px;white-space:nowrap;color:var(--muted)}
.chip.on{border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:700}
.blk h3{font-size:16px;letter-spacing:.08em;color:var(--muted);margin:12px 0 5px}
.blk.first h3{color:var(--flag)}
.cues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:620px){.cues{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cue{min-height:48px;padding:7px 10px;text-align:left;font-weight:700;font-size:17px;line-height:1.15;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.blk.first .cue{background:var(--flag-bg);border-color:var(--flag-line)}
.blk.small .cues{grid-template-columns:repeat(3,minmax(0,1fr))}
.blk.small .cue{min-height:44px;font-size:15px;padding:6px 8px}
.cue[aria-pressed="true"],.blk.first .cue[aria-pressed="true"]{background:none;border-style:dashed;border-color:var(--line);color:var(--muted);font-weight:400;opacity:.6}
.cue[aria-pressed="true"]::before{content:"✓ ";color:var(--ok);font-weight:700}
.dm{margin-top:14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dm h3{font-size:16px;letter-spacing:.08em;color:var(--flag);margin-bottom:3px}
.dm p{margin:3px 0;font-size:16px}
.full{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface)}
.full summary{padding:13px 0;font-weight:700;color:var(--accent)}
.full h4{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px}
.full ul{margin:0;padding-left:20px}
.full li{margin:5px 0}
.src{color:var(--muted);font-size:13px;margin:12px 0}

/* handover section */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tile.ho{background:var(--accent);color:var(--bg);border-color:var(--accent);font-size:18px;min-height:58px}
.tile.ho small{display:block;font-weight:400;font-size:13px;line-height:1.2;margin-top:3px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-block:8px 0}
.seg button{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700}
.seg button[aria-current="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.use{margin:8px 0 4px;font-size:15px;color:var(--muted)}
.tel{font-weight:700;color:var(--fg);white-space:nowrap;user-select:all;-webkit-user-select:all}
.step{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--fg);color:var(--bg);font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.rows{display:grid;gap:6px}
.row{display:flex;gap:12px;align-items:center;width:100%;min-height:58px;padding:6px 10px 6px 6px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
.row:active{background:var(--accent-soft)}
.row .L{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:8px;background:var(--accent);color:var(--bg);font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.row .W{min-width:0}
.row .T{display:block;font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.row .d{display:block;font-size:16px;line-height:1.25}
.row[aria-pressed="true"]{background:none;border-style:dashed;opacity:.55}
.row[aria-pressed="true"] .L{background:var(--ok)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<p class="wrap foot" id="offl"></p>
<script>
// first = ask in the first minute. s = [section title, [questions]]. miss = don't-miss list.
var G=["Heart & breathing","Brain & nerves","Medical","Trauma","Environment","Special calls"];
var SAMPLE=["Any allergies — medications, food, latex?","What medications do you take? Did you take them today?","Any blood thinners?","What medical problems do you have? Any surgeries?","Have you been in hospital in the last 90 days, or seen a doctor recently?","When did you last eat or drink?","What were you doing right before this started?","Is there a MOST form, No CPR form or advance directive we should know about?"];
var C=[
{id:"chest-pain",n:"Chest pain",g:0,k:"cardiac acs mi heart attack angina stemi",
first:["Is the pain there right now? Show me where with one finger.","Any trouble breathing?","Did you pass out, or feel like you were going to?","Have you taken Aspirin or nitro today? How much, and when? Is the nitro prescribed to you?","Any allergy to Aspirin? Any recent bleeding from your stomach or bowel?","Any Viagra, Cialis or Levitra in the last 2 days?"],
s:[["The pain (OPQRRRST)",["What time did it start? What were you doing?","Did it hit suddenly and at its worst right away, or build up slowly?","Does anything make it better or worse — a deep breath, moving, pressing on it?","What does it feel like — pressure, tight, sharp, burning, tearing?","Does it go anywhere — arm, jaw, neck, back, belly?","Did the nitro or resting help?","How bad out of 10 right now? At its worst?","Is it constant, or does it come and go?","Have you had this before? Is it the same as your angina or heart attack?"]],
["With the pain",["Nausea or vomiting?","Sweaty or clammy?","Dizzy or light-headed?","Heart racing or skipping beats?","Cough, fever, or coughing anything up?","Is one leg swollen or sore? Any long trip, surgery or bed rest lately?","Any cancer, pregnancy, birth control or hormone pills, or past blood clots?","Any new weakness, numbness, hoarse voice, or a cold or painful arm or leg?"]],
["Heart history",["Any heart problems — heart attack, stents, bypass, heart failure?","High blood pressure, diabetes, high cholesterol? Do you smoke?","Anyone in your family with heart disease at a young age?","Any aortic aneurysm or dissection in you or your family? Marfan syndrome? Any heart or aortic surgery?","Any cocaine or other stimulants today?"]]],
miss:["Heart attack — can show up as just shortness of breath, belly pain, fainting, nausea or tiredness, especially in women, older adults, diabetics and younger people","Blood clot in the lung (PE)","Aortic dissection — sharp or tearing pain, worst at the start; can be painless with only fainting or stroke signs; equal arm BPs do not rule it out","Collapsed lung","Pain when you press on the chest does not rule out the heart"]},

{id:"breathing",n:"Breathing problems",g:0,k:"sob short of breath dyspnea asthma copd chf wheeze respiratory",
first:["Can you speak in full sentences? (listen — full sentences, a few words, or single words)","When did this start? Suddenly or over hours or days?","Any chest pain? Did you faint or nearly faint?","Did you use your puffer? Which one, how many puffs, did it help?","Could this be an allergic reaction — any new food, medication, or a sting?"],
s:[["The breathing",["What were you doing when it started?","Is it worse lying flat? How many pillows do you sleep on?","Do you wake up at night gasping?","Is it worse when you walk or move?","Has this happened before? What was it that time?","Is this like your usual asthma / COPD attack, or different?"]],
["With it",["Any cough? Bringing anything up — what colour? Any blood?","Fever or chills?","Are your ankles or legs more swollen than usual? Gained weight this week?","Is one leg sore or swollen? Any long trip, surgery or bed rest lately?","Any cancer, pregnancy, birth control or hormone pills, or past blood clots?","Anything stuck in your throat? Did you choke on something?"]],
["Lung history",["Do you have asthma, COPD, heart failure, or a past blood clot?","Are you on home oxygen? How many litres? What is your normal oxygen level?","Is this the worst it has ever been?","Have you ever been intubated or in ICU for your breathing? How many hospital visits for it this year?","Have you been using your puffer more than usual lately?","Do you have an asthma or COPD action plan? Did you follow it? Did it help?","Any steroids or antibiotics recently?","Do you smoke or vape?","Were you around smoke, fumes or chemicals?"]]],
miss:["Anaphylaxis","Heart attack presenting as shortness of breath","Blood clot in the lung (PE)","Collapsed lung","Heart failure / fluid in the lungs","Sepsis from pneumonia","Beware the silent chest — a quiet chest in an asthmatic is worse than a wheezy one","Not all wheezing is asthma — heart failure and PE wheeze too","Too breathless to talk? Ask yes/no questions they can nod to"]},

{id:"heart-problems",n:"Heart problems / palpitations",g:0,k:"palpitations afib svt racing heart pacemaker icd aicd arrhythmia",
first:["Is your heart racing or fluttering right now?","Any chest pain or trouble breathing?","Did you pass out, or nearly?","Do you have a pacemaker or a defibrillator? Did it shock you? How many times?"],
s:[["The episode",["When did it start — more than 48 hours ago? What were you doing?","Did it start suddenly, like a switch, or build up?","Is it regular or all over the place? Can you tap the rhythm out for me?","Has this happened before? What stopped it last time?","How long do the episodes usually last?"]],
["With it",["Dizzy, light-headed, or weak?","Sweaty or nauseated?","Any fever, vomiting, diarrhea, or not drinking enough?","Any pain anywhere, or any bleeding?","Dizzy when you stand up, better lying flat?"]],
["Triggers and history",["Any known rhythm problem — A-fib, SVT? Any heart surgery or ablation?","Did you miss any heart pills? Any new medications?","Caffeine, energy drinks, alcohol, cold medicine or diet pills today?","Any cocaine, meth or other stimulants?","Any thyroid problems?","Any kidney problems or dialysis?","Are you on a beta-blocker or calcium channel blocker? Could you have taken extra?","Have you had a heart transplant?","Any anxiety or panic attacks? Does this feel the same?"]]],
miss:["Unstable rhythm — altered, ischemic chest pain, very short of breath or wet lungs, low BP (systolic under 80 narrow-complex, under 90 wide-complex)","Heart attack","A fast heart can be the body compensating for pain, blood loss, fever or low oxygen — fix the cause","Slow heart — think low oxygen, drug effect, high potassium, heart attack","A stable wide-complex rhythm can crash quickly","Sepsis or dehydration","Stimulant overdose"]},

{id:"cardiac-arrest",n:"Cardiac arrest",g:0,k:"cpr vsa code arrest dead not breathing",
first:["Did anyone see them go down? What time?","Was anyone doing CPR before we got here? How long were they down before it started — 20 minutes or more?","Was an AED used? Did it shock? How many times?","Is there a No CPR form, MOST form, advance directive, or a No CPR MedicAlert bracelet? Where is it?","Is there a representation agreement? Who is the decision-maker — are they here?"],
s:[["Just before",["What were they doing when it happened?","Did they complain of anything first — chest pain, trouble breathing, a headache?","Did they choke on something?","Any seizure-like shaking?","Any bleeding, vomiting or diarrhea beforehand?","When were they last seen well?"]],
["Possible causes",["Any heart problems? Kidney failure or dialysis?","Any drugs or alcohol today? Any opioids in the home?","Any recent illness, surgery or injury?","Were they in cold water or out in the cold?","Could this be an allergic reaction — food, a sting, a new medication?","Do they have asthma? Any leg swelling, cancer, or being laid up recently?","Could they have taken too many pills on purpose?","Any terminal illness or palliative care?"]],
["For the family",["What medications are they on? Can someone bring the pills or a list?","Any allergies?","Who is next of kin? Who is the family doctor?"]]],
miss:["Reversible causes — low oxygen, blood loss, acidosis, low or high potassium (dialysis), cold, overdose or anaphylaxis, tamponade, tension pneumothorax, clot in the lung or heart","Photograph the No CPR or MOST document for your record — forms differ between health authorities","Opioid overdose — look for the scene clues","Ask bystanders, not just family — the person who saw it knows the downtime"]},

{id:"choking",n:"Choking",g:0,k:"fbao airway obstruction foreign body",
first:["Can you speak or cough? (strong cough — let them cough; weak cough, stridor or turning blue — treat as complete)","What did they choke on?","Is it still stuck, or did it come out?","Did they turn blue or pass out?","Is the patient pregnant? Is the child under 1 year old?"],
s:[["What happened",["When did it happen? How long were they choking?","What was done — back blows, abdominal thrusts, CPR? By who?","Did anything come out? Do you have it?","Any injury to the mouth, face or neck?"]],
["Right now",["Any trouble breathing or noisy breathing now?","Does it still feel like something is stuck?","Can you swallow your own saliva?","Any pain in your throat, chest or belly?","Is your voice different from normal?","Any vomiting?"]],
["History",["Any trouble swallowing normally — stroke, dementia, Parkinson's?","Any alcohol or sedating medication before eating?","Has this happened before?","Any dentures?","Any fever, barking cough, sore throat or drooling before this?"]]],
miss:["Partial obstruction that can still become complete","Aspiration — coughing or low sats afterwards","Anyone given abdominal thrusts — by a bystander or by us — goes to hospital","Croup or epiglottitis rather than a foreign body","Was it really choking, or an allergic reaction / cardiac arrest at the table?"]},

{id:"stroke",n:"Stroke",g:1,k:"cva tia fast facial droop slurred speech weakness",
first:["When were they LAST SEEN NORMAL? Exact clock time, and who saw them? (hot stroke = within 6 hours, or woke with symptoms)","Did they wake up like this? What time did they go to bed?","Any blood thinners? Which one, and when was the last dose?","Has the blood sugar been checked?","Any seizure at the start?"],
s:[["What changed",["What did you notice first — face, arm, leg, speech, vision, balance?","Which side?","Did it come on all at once?","Is it getting better, worse, or staying the same?","Any sudden severe headache? Vomiting?","Any trouble seeing — double vision, or loss of vision on one side?","Any trouble swallowing?","Did they fall or hit their head?"]],
["Normal for them",["How are they normally — walking, talking, living on their own?","Any old weakness from a previous stroke?","Is the confusion new, or do they have dementia?"]],
["History",["Any past stroke or TIA?","High blood pressure, A-fib, diabetes?","Any recent surgery, bleeding, or head injury?","Who can come with us or be reached by phone? What is their number?"]]],
miss:["Low blood sugar looks exactly like a stroke — check it","Seizure with weakness afterwards","Head bleed — severe headache, vomiting, unequal pupils, slow pulse with high BP, blood thinners","A negative FAST-VAN does not rule out a stroke","Symptoms that went away are still a TIA — convey to a stroke centre or an ED with CT","Get the last-seen-normal time and a phone number for the witness before you leave"]},

{id:"seizure",n:"Seizure",g:1,k:"convulsion fit epilepsy postictal",
first:["Are they still seizing? How long has it been going?","How many seizures today? Did they wake up in between?","Do they have epilepsy / known seizures?","Are they diabetic? Has the sugar been checked?","Could she be pregnant, or did she recently have a baby? How many weeks?"],
s:[["What it looked like (ask the witness)",["What did you see first? What were they doing right before?","Whole body shaking, or one side, or just staring?","Did they fall? Did they hit their head?","Did they turn blue? Bite their tongue? Lose bladder control?","How long did the shaking last?","How were they afterwards — confused, sleepy, back to normal? How long did that take?","Did anyone give their prescribed rescue medication (a benzodiazepine)? How much, and when?"]],
["If they have seizures",["What seizure medication? Any missed doses or recent changes?","Is this like their usual seizure?","How often do they normally have one? When was the last?"]],
["If it is the first one",["Any head injury recently?","Any fever, headache, or stiff neck?","Any alcohol — when was the last drink? Any drugs?","Any new medications?","Any contact with chemicals or toxic substances?","Any history of stroke, brain tumour, or cancer?","If pregnant: any headache, vision changes, or pain under the right ribs before the seizure? Any high blood pressure this pregnancy?"]]],
miss:["Low blood sugar","Low oxygen or cardiac arrest — brief shaking is common at the start of an arrest","Head injury or brain bleed","Alcohol withdrawal","Eclampsia — pregnant or up to weeks after delivery","Overdose","Stroke, brain infection, or electrolyte problems","Injuries from the fall","Confusion or aggression after a seizure is not intentional — give them quiet space","Known epileptic, one short seizure, declines transport — CliniCall consult"]},

{id:"fainting",n:"Unconscious / fainting",g:1,k:"syncope passed out collapse loc faint blackout",
first:["Are they fully awake now? Back to normal?","Any chest pain, palpitations, or trouble breathing before or after?","Did they hit their head or hurt anything when they went down?","Are they diabetic?","Any shaking or seizure activity?"],
s:[["Before",["What were you doing — standing up, straining on the toilet, exercising, lying down?","Any warning — dizzy, hot, sweaty, blurred or tunnel vision, weakness, nausea?","Any pain, sight of blood, or big emotional upset just before?","Were you out in the heat or working hard in a hot place?","Or no warning at all?","Any headache or back or belly pain before it?"]],
["During (ask the witness)",["How long were they out?","What colour were they — pale, grey, blue?","Any jerking? Did they wet themselves?","Did someone catch them, or did they hit the floor?"]],
["After",["How fast did they come around — seconds, or were they confused for a while?","How do you feel now?"]],
["Why",["Has this happened before? Was a cause found?","Eating and drinking normally? Any vomiting or diarrhea?","Any black or bloody stools?","Any new or changed medications — blood pressure pills, water pills, beta-blockers, sedatives, opioids? Could you have taken extra?","Any kidney problems or dialysis?","Could you be pregnant? When was your last period?","Any heart problems? Anyone in your family die suddenly when young?"]]],
miss:["Heart rhythm problem — collapse with no warning is a dysrhythmia until proven otherwise, even with normal vitals and ECG","Out for more than a minute or two — look for another cause or an injury","Nearly fainting is worked up the same as fainting","Check FAST-VAN once they are awake","Heart attack, PE, aortic dissection","Internal bleeding — GI bleed, ruptured ectopic, AAA","Low blood sugar","Stroke or seizure","The injury from the fall"]},

{id:"confused",n:"Altered / confused",g:1,k:"altered loc aloc confusion delirium not acting right unresponsive gcs",
first:["How are they normally? What is different today?","When were they last seen normal?","Are they diabetic? Do they take insulin — could they have taken too much? Has the sugar been checked?","Any drugs, alcohol or pills they could have taken? Any opioids in the home?","Any fall or head injury?"],
s:[["The change",["Did it come on suddenly, or over hours or days?","Is it getting worse, or does it come and go?","Any weakness on one side, slurred speech, or facial droop?","Any seizure?","Any headache or vomiting?","Are they seeing or hearing things?"]],
["Looking for the cause",["Any fever, cough, or burning when they pee? Peeing more often, or much less?","Have they had Tylenol or Advil today? (it hides a fever)","Any new rash or blotchy skin?","Eating and drinking normally?","Any new medications, or changes in dose? Any missed doses?","Any chest pain or trouble breathing?","Is the furnace or a heater on — is anyone else in the home feeling sick?","Any history of mental illness, dementia, liver or kidney disease?","Any cancer, chemo, or immune-suppressing medication? In hospital in the last 90 days?","Any Addison's disease or long-term steroids?"]],
["From the scene",["Who found them? Where and how?","Any pill bottles, drug gear, alcohol, or a note?","How long could they have been on the floor?","Is the home very cold or very hot?"]]],

function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function find(id){for(var i=0;i<C.length;i++)if(C[i].id===id)return C[i];return null}

function tile(id){return '<button class="tile" data-go="'+id+'">'+esc(SN[id])+'</button>'}
function list(q){
  var h="";

    var m=C.filter(function(c){return (SN[c.id]+" "+c.n+" "+c.k).toLowerCase().indexOf(q)>=0});
    var ho=!adding&&HOWORDS.indexOf(q)>=0?hoTiles():"";
    return m.length||ho?ho+(m.length?'<div class="grid3">'+m.map(function(c){return tile(c.id)}).join("")+'</div>':''):'<p class="none">Nothing matches. Try another word, or open Sick / weak.</p>';

}

function card(c){
  var ids=[c.id].concat(extra.filter(function(i){return i!==c.id})), seen={};
  function uniq(a){return a.filter(function(t){var k=t.toLowerCase();if(seen[k])return false;seen[k]=1;return true})}
  function all(f){var o=[];ids.forEach(function(i){o=o.concat(K[i][f]||[])});return o}
  if(ids.indexOf("chest-pain")>=0)seen[Q.cps.toLowerCase()]=1;

  var o=HO[id], n=0;
  var h='<div class="bar"><button class="back" data-go="'+from+'" data-keep aria-label="Back">‹</button><h2>'+esc(o.n)+'</h2><button class="newpt" id="clearho">Clear</button></div>';
  h+='<div class="seg">'+Object.keys(HO).map(function(k){return '<button data-go="'+k+'" data-keep aria-current="'+(k===id)+'">'+esc(HO[k].n)+'</button>'}).join("")+'</div>';
  h+='<p class="use">'+o.use+'</p>';
  o.parts.forEach(function(p){
    if(p.step){h+='<div class="step">'+esc(p.step)+'</div>';return}
    h+='<section class="blk"><h3>'+esc(p.h)+'</h3><div class="rows">';
    p.rows.forEach(function(r){var key="ho:"+id+":"+(n++);
      h+='<button class="row" data-row="'+key+'" aria-pressed="'+(done[key]?"true":"false")+'"><span class="L">'+r[0]+'</span><span class="W"><span class="T">'+esc(r[1])+'</span>'+r[2].map(function(d){return '<span class="d">'+esc(d)+'</span>'}).join("")+'</span></button>'});
    h+='</div></section>';
  });
  o.more.forEach(function(m){h+='<details class="full"><summary>'+esc(m[0])+'</summary><ul>'+m[1].map(function(t){return"<li>"+esc(t)+"</li>"}).join("")+'</ul></details>'});
  h+='<p class="src">From BCEHS guideline A03 Clinical Handover and Communication, as published 26 Nov 2026.</p>';
  app.innerHTML=h;
}
function route(){
  var id=location.hash.replace("#",""), c=find(id);
  if(HO[id]&&!adding)handover(id); else if(c&&!adding)card(c); else home();
  window.scrollTo(0,0);
}
function go(id){ if(location.hash.replace("#","")===id)route(); else location.hash=id }
var wl=null;
function wake(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request("screen").then(function(l){wl=l;l.addEventListener("release",function(){wl=null})}).catch(function(){})}catch(e){}}
app.addEventListener("click",function(e){
  wake();
  var t=e.target.closest("button"); if(!t)return;
  var cur=location.hash.replace("#","");
  if(t.hasAttribute("data-row")){var rk=t.getAttribute("data-row"), ron=t.getAttribute("aria-pressed")!=="true"; t.setAttribute("aria-pressed",ron?"true":"false"); if(ron)done[rk]=1; else delete done[rk]}
  else if(t.id==="clearho"){Object.keys(done).forEach(function(x){if(x.indexOf("ho:"+cur+":")===0)delete done[x]}); route()}
  else if(t.hasAttribute("data-cue")){var k=t.getAttribute("data-cue"), on=t.getAttribute("aria-pressed")!=="true"; t.setAttribute("aria-pressed",on?"true":"false"); if(on)done[k]=1; else delete done[k]; left()}
  else if(t.hasAttribute("data-go")){var id=t.getAttribute("data-go");
    if(adding&&id){var p=adding; if(id!==p&&extra.indexOf(id)<0)extra.push(id); adding=""; query=""; go(p)}
    else{ if(HO[id]&&!HO[cur])from=cur; if(id&&!t.hasAttribute("data-keep"))extra=[]; adding=""; query=""; go(id) }}
  else if(t.hasAttribute("data-add")){extra.push(t.getAttribute("data-add")); route()}
  else if(t.hasAttribute("data-rm")){var r=t.getAttribute("data-rm"); extra=extra.filter(function(i){return i!==r}); route()}
  else if(t.id==="addother"){adding=cur; go("")}
  else if(t.id==="canceladd"){var b=adding; adding=""; go(b)}
  else if(t.id==="newpt"){done={}; extra=[]; route()}
});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")wake()});
window.addEventListener("hashchange",route);
route();
</script>
<script>
(function(){
  var el=document.getElementById('offl'), V='26 Nov 2026 23:02';
  function say(t){el.textContent=t+' · Version '+V}
  if(!('serviceWorker' in navigator)||!window.isSecureContext){say('Offline use is not available in this browser');return}
  var had=!!navigator.serviceWorker.controller;
  say(had?'Offline ready \u2713':'Saving for offline use\u2026');
  navigator.serviceWorker.register('./sw.js').then(function(){return navigator.serviceWorker.ready})
    .then(function(){say('Offline ready \u2713 works with no signal')})
    .catch(function(){say('Could not save for offline use')});
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!had){had=true;return}
    if(!location.hash.replace('#','')&&!Object.keys(done).length)location.reload();
    else say('Update saved, it loads next time you open the app');
  });
})();
</script>
