<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1E47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PCR Practice">
<title>Private page</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
html{height:100%;background:#0E1E47}
body{min-height:100%;margin:0;display:flex;align-items:center;justify-content:center;font:16px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#0D1B33;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
form{width:min(360px,100%);padding:20px;background:#D5E2F5;border:2px solid #17306B;border-radius:10px}
h1{margin:0 0 6px;font-size:20px}
p{margin:0 0 12px;font-size:14px}
input{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #7F9BC6;border-radius:6px;background:#fff;color:#0D1B33}
button{width:100%;margin-top:10px;min-height:46px;font:inherit;font-weight:700;color:#fff;background:#2F8F22;border:1px solid #124a0c;border-radius:6px;cursor:pointer}
#msg{min-height:20px;margin:10px 0 0;font-weight:700;color:#8A1C1C}
:focus-visible{outline:3px solid #FFD54A;outline-offset:1px}
[hidden]{display:none!important}
</style>
</head>
<body>
<form id="f" hidden>
<h1>Private page</h1>
<p>Enter the password to open it. This device remembers it, and after the first time the page opens without internet.</p>
<label for="pw" style="font-size:13px;font-weight:700">Password</label>
<input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
<button type="submit">Open</button>
<p id="msg" role="status"></p>
</form>
<script>
(function(){
  var SALT="OKxRqiSflw2ARKNP+YOUIQ==", IV="TkeNxAObn/3N4leh", IT=250000, KEYNAME="pcr-key-1", VER="27 Nov 2026 18:39";
  var f=document.getElementById("f"), pw=document.getElementById("pw"), msg=document.getElementById("msg");
  function b64(s){var b=atob(s), u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function toB64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function load(){return fetch("./app.bin").then(function(r){if(!r.ok)throw new Error("load");return r.arrayBuffer()},function(){throw new Error("load")})}
  // decrypts with the raw key; on success remembers the key on this device and replaces the page with the app
  function run(raw){
    return crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]).then(function(k){
      return load().then(function(ct){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},k,ct)})
    }).then(function(pt){
      try{localStorage.setItem(KEYNAME,toB64(raw))}catch(e){}
      var html=new TextDecoder("utf-8").decode(pt);
      document.open();document.write(html);document.close();
    })}
  function derive(p){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]).then(function(k){
      return crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(SALT),iterations:IT,hash:"SHA-256"},k,256)
    }).then(function(bits){return new Uint8Array(bits)})}
  if("serviceWorker" in navigator&&window.isSecureContext)navigator.serviceWorker.register("./sw.js").catch(function(){});
  if(!window.crypto||!crypto.subtle){f.hidden=false;msg.textContent="This browser cannot open the page. Use the https address.";return}
  var saved=null;try{saved=localStorage.getItem(KEYNAME)}catch(e){}
  if(saved)run(b64(saved)).catch(function(e){if(e&&e.message!=="load"){try{localStorage.removeItem(KEYNAME)}catch(x){}}f.hidden=false;
    if(e&&e.message==="load")msg.textContent="Could not load the page. Connect to the internet once, then it works offline."});
  else f.hidden=false;
  f.addEventListener("submit",function(e){e.preventDefault();if(!pw.value)return;msg.style.color="#0D1B33";msg.textContent="Opening…";
    derive(pw.value).then(run).catch(function(err){msg.style.color="#8A1C1C";
      msg.textContent=err&&err.message==="load"?"Could not load the page. Connect to the internet once, then it works offline.":"That password is not right."})});
})();
</script>
</body>
</html>
