<body>
  <p>Opening EMR Play &amp; learn… <a href="../#/play">Tap here if nothing happens.</a></p>
  <script>
    // Short shareable address for the EMR Play & learn hub (src/play.js). A first-time visitor gets the EMR track and the
    // site's English default; anyone who already chose a track or a language keeps it.
    try {
      var k = 'bcprep2', s = JSON.parse(localStorage.getItem(k) || '{}');
      if (!s.track) s.track = 'emr';
      localStorage.setItem(k, JSON.stringify(s));
    } catch (e) { /* storage blocked: the hub works without it */ }
    location.replace('../#/play');
  </script>
</body>
